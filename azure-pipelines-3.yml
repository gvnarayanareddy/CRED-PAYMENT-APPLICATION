# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml


pool:
  vmImage: 'ubuntu-latest'

variables:
  acrServiceConnection: 'ACRCONNECTION'
  frontendRepository: 'credpay/frontend'
  userRepository: 'credpay/user-service'
  paymentRepository: 'credpay/payment-service'
  tag: '$(Build.BuildId)'

stages:

- stage: Terraform
  displayName: 'Terraform Stage'
  jobs:
  - job: TerraformJob
    displayName: 'Terraform Job'

    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '1.13.3'

    - task: AzureCLI@2
      displayName: 'Terraform Init'
      inputs:
        azureSubscription: 'Manualcred'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(Build.SourcesDirectory)/terraform'
        inlineScript: |
          terraform init

    - task: AzureCLI@2
      displayName: 'Terraform Validate'
      inputs:
        azureSubscription: 'Manualcred'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(Build.SourcesDirectory)/terraform'
        inlineScript: |
          terraform validate

    - task: AzureCLI@2
      displayName: 'Create Terraform Variables File'
      inputs:
        azureSubscription: 'Manualcred'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(Build.SourcesDirectory)/terraform'
        inlineScript: |
          cp terraform.tfvars.example terraform.tfvars

    - task: AzureCLI@2
      displayName: 'Terraform Plan'
      inputs:
        azureSubscription: 'Manualcred'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(Build.SourcesDirectory)/terraform'
        inlineScript: |
          terraform plan -var-file="terraform.tfvars"

    - task: AzureCLI@2
      displayName: 'Terraform Apply'
      inputs:
        azureSubscription: 'Manualcred'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(Build.SourcesDirectory)/terraform'
        inlineScript: |
          terraform apply -auto-approve -var-file="terraform.tfvars"      
